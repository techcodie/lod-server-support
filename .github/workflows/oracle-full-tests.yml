name: Oracle Full Tests
on: workflow_dispatch:
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task-base-101
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Apply oracle + tests
        run: |
          set -eux
          mkdir -p .github/task-patches
          curl -fsSL -o .github/task-patches/golden.patch https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/golden.patch
          curl -fsSL -o .github/task-patches/tests.patch https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/tests.patch
          git apply .github/task-patches/golden.patch
          git apply .github/task-patches/tests.patch
      - name: Run all graded module tests via Gradle
        run: |
          set -eux
          ./gradlew --no-daemon --max-workers=1 :fabric:test \
            --tests dev.vox.lss.networking.server.LSSServerNetworkingHandshakeGlueTest \
            --tests dev.vox.lss.config.ConfigValidationTest \
            --tests dev.vox.lss.networking.server.HandshakeGateTest
          ./gradlew --no-daemon --max-workers=1 :paper:test \
            --tests dev.vox.lss.paper.LSSPaperPluginViaProductionTest \
            --tests dev.vox.lss.paper.PaperConfigValidationTest \
            --tests dev.vox.lss.paper.LSSPaperPluginGlueTest \
            --tests dev.vox.lss.paper.PluginYmlContractTest
