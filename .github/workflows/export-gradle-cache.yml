name: Export Gradle Cache

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 871dcd0a2a1ea5d1526a25d692c13b7e37f2d68a

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Write task warm patches
        run: |
          mkdir -p .github/task-patches
          base64 -d > .github/task-patches/golden.patch <<'EOF'

EOF
          base64 -d > .github/task-patches/tests.patch <<'EOF'

EOF

      - name: Warm verifier compile targets
        run: |
          set -eux
          git apply .github/task-patches/golden.patch
          git apply .github/task-patches/tests.patch
          ./gradlew --no-daemon --max-workers=1             :common:compileJava             :fabric:testClasses             :paper:testClasses

      - name: Archive Gradle user home
        run: tar -cf gradle-user-home.tar -C "${HOME}" .gradle

      - uses: actions/upload-artifact@v5
        with:
          name: gradle-user-home
          path: gradle-user-home.tar
          retention-days: 7
