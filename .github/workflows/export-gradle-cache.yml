name: Export Gradle Cache

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task-base-101

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Fetch task patches
        run: |
          set -eux
          mkdir -p .github/task-patches
          curl -fsSL -o .github/task-patches/golden.patch \
            https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/golden.patch
          curl -fsSL -o .github/task-patches/tests.patch \
            https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/tests.patch

      - name: Warm verifier compile + runtime classpath jars
        run: |
          set -eux
          git apply .github/task-patches/golden.patch
          git apply .github/task-patches/tests.patch
          cat > /tmp/verifier-warm.init.gradle <<'GRADLE'
          gradle.projectsLoaded { g ->
              g.rootProject.subprojects { sub ->
                  sub.plugins.withId('java') {
                      sub.tasks.register('verifierWarmRuntimeClasspath') {
                          dependsOn sub.tasks.named('testClasses')
                          doLast {
                              sub.configurations.named('testRuntimeClasspath').get().resolve().each { f ->
                                  println "WARM ${sub.path}: ${f.name}"
                              }
                          }
                      }
                  }
              }
          }
          GRADLE
          ./gradlew --no-daemon --max-workers=1 \
            :common:compileJava \
            :fabric:testClasses \
            :paper:testClasses
          ./gradlew --no-daemon --max-workers=1 \
            --init-script /tmp/verifier-warm.init.gradle \
            :fabric:verifierWarmRuntimeClasspath \
            :paper:verifierWarmRuntimeClasspath

      - name: Archive Gradle user home
        run: |
          set -eux
          tar -cf gradle-user-home.tar -C "${HOME}" .gradle
          sha256sum gradle-user-home.tar | tee gradle-user-home.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: gradle-user-home
          path: gradle-user-home.tar
          retention-days: 7

      - name: Publish cache to task release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          SHA256=$(awk '{print $1}' gradle-user-home.sha256)
          echo "GRADLE_CACHE_SHA256=${SHA256}" >> "$GITHUB_ENV"
          gh release view task-101-gradle-cache >/dev/null 2>&1 || \
            gh release create task-101-gradle-cache --title "Task 101 pre-warmed Gradle cache" --notes "Pinned Gradle user home for Sentinel task 101 Docker builds."
          ASSET=$(gh release view task-101-gradle-cache --json assets --jq '.assets[] | select(.name=="gradle-user-home.tar") | .id' || true)
          if [ -n "$ASSET" ]; then gh release delete-asset task-101-gradle-cache gradle-user-home.tar -y; fi
          gh release upload task-101-gradle-cache gradle-user-home.tar --clobber
