name: Export Gradle Cache

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Warm verifier compile targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def inject(path: Path, needle: str, block: str) -> None:
              text = path.read_text()
              if block.strip().splitlines()[0] in text:
                  return
              path.write_text(text.replace(needle, needle + block))

          inject(
              Path("fabric/build.gradle"),
              'testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"',
              '\n    testImplementation "org.mockito:mockito-core:5.20.0"\n'
              '    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"',
          )
          PY
          ./gradlew --no-daemon --max-workers=1 :common:compileJava :fabric:testClasses
          ./gradlew --no-daemon --max-workers=1 :paper:testClasses

      - name: Archive Gradle user home
        run: tar -cf gradle-user-home.tar -C "${HOME}" .gradle

      - uses: actions/upload-artifact@v5
        with:
          name: gradle-user-home
          path: gradle-user-home.tar
          retention-days: 7
