name: Oracle 3x Validate

on:
  workflow_dispatch:
    inputs:
      task_dir:
        description: Unused; patches fetched from main
        required: false

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task-base-101

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Fetch task assets
        run: |
          set -eux
          mkdir -p .github/task-patches /tests /solution /logs/verifier
          curl -fsSL -o .github/task-patches/golden.patch             https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/golden.patch
          curl -fsSL -o .github/task-patches/tests.patch             https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/tests.patch
          curl -fsSL -o /tests/config.json             https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/config.json
          curl -fsSL -o /tests/test.sh             https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/test.sh
          curl -fsSL -o /solution/golden.patch             https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/golden.patch
          curl -fsSL -o /solution/solve.sh             https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/solve.sh
          chmod +x /tests/test.sh /solution/solve.sh

      - name: Oracle attempt ${{ matrix.attempt }} — solve + verify
        run: |
          set -eux
          bash /solution/solve.sh
          bash /tests/test.sh
          test "$(cat /logs/verifier/reward.txt)" = "1"
