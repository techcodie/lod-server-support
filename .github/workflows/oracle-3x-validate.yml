name: Oracle 3x Validate

on:
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task-base-101

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Fetch task assets
        run: |
          set -eux
          sudo mkdir -p /tests /solution /logs/verifier
          sudo chmod -R a+rwX /logs
          mkdir -p .github/task-patches
          for f in golden.patch tests.patch config.json test.sh solve.sh; do
            curl -fsSL -o ".github/task-patches/$f" \
              "https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/$f"
          done
          sudo cp .github/task-patches/golden.patch /solution/golden.patch
          sudo cp .github/task-patches/tests.patch /tests/tests.patch
          sudo cp .github/task-patches/config.json /tests/config.json
          sudo cp .github/task-patches/test.sh /tests/test.sh
          sudo cp .github/task-patches/solve.sh /solution/solve.sh
          sudo chmod +x /tests/test.sh /solution/solve.sh gradlew

      - name: Install pre-warmed Gradle cache
        run: |
          set -eux
          curl -fsSL -o /tmp/gradle-user-home.tar \
            https://github.com/techcodie/lod-server-support/releases/download/task-101-gradle-cache/gradle-user-home.tar
          echo "66e2fbb42968c606d4c3525b42432b7f90bbb0ee13fc6a966faf0a26a174bb76  /tmp/gradle-user-home.tar" | sha256sum -c -
          tar -xf /tmp/gradle-user-home.tar -C "${HOME}"

      - name: Oracle attempt ${{ matrix.attempt }} — solve + verify
        run: |
          set -eux
          sudo rm -rf /app
          sudo ln -sfn "${PWD}" /app
          bash /solution/solve.sh
          bash /tests/test.sh || {
            echo "=== verifier stderr ==="
            cat /logs/verifier/test-stderr.txt || true
            echo "=== verifier stdout ==="
            cat /logs/verifier/test-stdout.txt || true
            echo "=== reward ==="
            cat /logs/verifier/reward.txt || true
            exit 1
          }
          test "$(cat /logs/verifier/reward.txt)" = "1"
