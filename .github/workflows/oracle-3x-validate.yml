name: Oracle 3x Validate

on:
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task-base-101

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Fetch task assets
        run: |
          set -eux
          mkdir -p .github/task-patches /tests /solution /logs/verifier
          for f in golden.patch tests.patch config.json test.sh solve.sh; do
            curl -fsSL -o ".github/task-patches/$f" \
              "https://raw.githubusercontent.com/techcodie/lod-server-support/main/.github/task-patches/$f"
          done
          cp .github/task-patches/golden.patch /solution/golden.patch
          cp .github/task-patches/tests.patch /tests/tests.patch
          cp .github/task-patches/config.json /tests/config.json
          cp .github/task-patches/test.sh /tests/test.sh
          cp .github/task-patches/solve.sh /solution/solve.sh
          chmod +x /tests/test.sh /solution/solve.sh

      - name: Install pre-warmed Gradle cache
        run: |
          set -eux
          curl -fsSL -o /tmp/gradle-user-home.tar \
            https://github.com/techcodie/lod-server-support/releases/download/task-101-gradle-cache/gradle-user-home.tar
          tar -xf /tmp/gradle-user-home.tar -C "${HOME}"

      - name: Oracle attempt ${{ matrix.attempt }} — solve + verify
        run: |
          set -eux
          sudo ln -sfn "${PWD}" /app
          bash /solution/solve.sh
          bash /tests/test.sh
          test "$(cat /logs/verifier/reward.txt)" = "1"
